name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

# 只合并 agent 验证分支上的运行，其余各跑各的。
concurrency:
  group: ${{ startsWith(github.ref, 'refs/heads/agent/') && format('ci-{0}', github.ref) || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        include:
          # Linux 不是目标平台，显示器面板依赖的 webkit2gtk 也不在默认镜像里。
          - os: ubuntu-latest
            cargo_args: --exclude baton-gui
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace ${{ matrix.cargo_args }} --all-targets -- -D warnings
      - run: cargo test --workspace ${{ matrix.cargo_args }}
