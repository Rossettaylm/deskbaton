name: Windows build

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p baton-cli -p baton-agent -p baton-gui
      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/deskbaton-cli.exe, target/release/deskbaton.exe, target/release/deskbaton-gui.exe, config.example.toml dist/
      - uses: actions/upload-artifact@v4
        with:
          name: deskbaton-windows
          path: dist/
          retention-days: 7
