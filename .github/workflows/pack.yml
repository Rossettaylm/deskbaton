name: Pack

on:
  push:
    branches: [main]
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  pack:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundle: dmg
            artifact_suffix: macos-aarch64.dmg
          - os: windows-latest
            bundle: nsis
            artifact_suffix: windows-x64-setup.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Read version
        id: ver
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          version=$(awk '/^\[workspace.package\]/{p=1;next} /^\[/{p=0} p && /^version = /{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "tag ${GITHUB_REF_NAME} 与 workspace version ${version} 不一致" >&2
              exit 1
            fi
            if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
              echo "缺少 TAURI_SIGNING_PRIVATE_KEY" >&2
              exit 1
            fi
          fi
      - name: Prepare macOS helper
        if: runner.os == 'macOS'
        run: |
          cargo build --release -p baton-sleep-helper
          mkdir -p crates/baton-gui/binaries
          cp target/release/deskbaton-sleep-helper \
            crates/baton-gui/binaries/deskbaton-sleep-helper-aarch64-apple-darwin
      - name: Strip externalBin on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $conf = 'crates/baton-gui/tauri.conf.json'
          $j = Get-Content $conf -Raw | ConvertFrom-Json
          $j.bundle.externalBin = @()
          $j.build.beforeBundleCommand = ''
          $j | ConvertTo-Json -Depth 20 | Set-Content $conf
      - uses: tauri-apps/tauri-action@v0
        if: github.ref_type != 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: crates/baton-gui
          args: --bundles ${{ matrix.bundle }}
      - uses: tauri-apps/tauri-action@v0
        if: github.ref_type == 'tag'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/baton-gui
          args: '--bundles ${{ matrix.bundle }} --config {"bundle":{"createUpdaterArtifacts":true}}'
          tagName: ${{ github.ref_name }}
          releaseName: DeskBaton ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Rename artifact
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.bundle }}" = "dmg" ]; then
            src=$(find target/release/bundle/dmg crates/baton-gui/target/release/bundle/dmg \
              -name '*.dmg' 2>/dev/null | head -n 1 || true)
          else
            src=$(find target/release/bundle/nsis crates/baton-gui/target/release/bundle/nsis \
              -name '*.exe' 2>/dev/null | head -n 1 || true)
          fi
          test -n "$src"
          cp "$src" "dist/DeskBaton-${{ steps.ver.outputs.version }}-${{ matrix.artifact_suffix }}"
      - uses: actions/upload-artifact@v4
        with:
          name: DeskBaton-${{ steps.ver.outputs.version }}-${{ matrix.artifact_suffix }}
          path: dist/DeskBaton-${{ steps.ver.outputs.version }}-${{ matrix.artifact_suffix }}
          retention-days: 7
