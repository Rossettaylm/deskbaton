[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "GPL-3.0-or-later"
repository = "https://github.com/Rossettaylm/deskbaton"

[workspace.dependencies]
baton-core = { path = "crates/baton-core" }
baton-display = { path = "crates/baton-display" }
baton-power = { path = "crates/baton-power" }
baton-input = { path = "crates/baton-input" }
baton-net = { path = "crates/baton-net" }
baton-macos-sys = { path = "crates/baton-macos-sys" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
cc = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
