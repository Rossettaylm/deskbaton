[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/Rossettaylm/deskbaton"

[workspace.dependencies]
baton-core = { path = "crates/baton-core" }
baton-display = { path = "crates/baton-display" }
baton-power = { path = "crates/baton-power" }
baton-input = { path = "crates/baton-input" }
baton-net = { path = "crates/baton-net" }
baton-macos-sys = { path = "crates/baton-macos-sys" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
log = "0.4"
sha2 = "0.11"
hmac = "0.13"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
getrandom = "0.4"
tempfile = "3"
global-hotkey = "0.8"
ctrlc = { version = "3", features = ["termination"] }
env_logger = "0.11"
gethostname = "1"
clap = { version = "4", features = ["derive"] }
cc = "1"
windows = "0.62"
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-build = "2.7"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
