[package]
name = "baton-agent"
description = "DeskBaton 常驻程序：托盘、热键，组装各模块"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "deskbaton"
path = "src/main.rs"

[dependencies]
baton-core.workspace = true
baton-display.workspace = true
baton-power.workspace = true
baton-input.workspace = true
baton-net.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
ctrlc.workspace = true
gethostname.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
global-hotkey.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
baton-macos-sys.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, features = ["Win32_UI_WindowsAndMessaging"] }

[lints]
workspace = true
