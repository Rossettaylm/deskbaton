# DeskBaton 配置示例（以合盖的 MacBook 为例）。
# macOS：~/Library/Application Support/DeskBaton/config.toml
# Windows：%APPDATA%\DeskBaton\config.toml

# 本机名称，显示在对端面板上；对端配置了 [[peers]] 时须与其 name 一致。不填时取主机名。
# 面板「设置」改过名称或热键后，以数据目录 state.toml 为准，不再回写本文件。
name = "macbook"
hotkey = "Ctrl+Alt+Space"

[display]
# 可选：本机在显示器上对应的输入源编码。不写时，本机有键鼠操作时自动识别并记在 state.toml。
# input_code = 0x1B

# 可选：Windows 上显示器不支持 DDC 调音量时，面板改调系统里名称包含这个子串的音频输出设备。
# 不写时用显示器型号匹配；匹配不到或不唯一时显示「不支持调音量」。
# audio_device = "HP D27k"

# 显示器面板（deskbaton-gui）上的输入源按钮，不写时默认 DP 0x0F / HDMI1 0x11 / HDMI2 0x12 / USB-C 0x1B。
# 编码因显示器而异，例如泰坦军团 P275MV 把 USB-C 报成 0x0F，要写成：
# [[display.inputs]]
# label = "USB-C"
# code = 0x0F

[network]
port = 47800
# 可选：两端相同时首次连接自动配对；不写则在 DeskBaton 面板里核对 6 位数字配对。
# token = "change-me"

[power]
# peer_offline：对端在线期间保持唤醒（自己持棒也不释放）；duration：交出后保持 stay_awake_secs 秒。
stay_awake_until = "peer_offline"

# 可选的兜底：配对后档案会记下对端的地址和 MAC，这里可以不写。
[[peers]]
name = "windows-desktop"
address = "192.168.1.20:47800"
wol_mac = "aa:bb:cc:dd:ee:ff"
